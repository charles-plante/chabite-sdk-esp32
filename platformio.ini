; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; `native` is a test-only environment (unit tests on the host PC). Limit the
; default `pio run` build to the firmware so it isn't compiled as firmware.
; Run the host tests explicitly with: pio test -e native
[platformio]
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
test_ignore = test_native
upload_port = /dev/cu.wchusbserial58FC0613931
upload_speed = 115200
monitor_speed = 115200

[env:native]
platform = native
test_framework = unity
test_filter = test_native
build_flags = -std=gnu++11
